<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WiFi Odds</title>
<style>
  /* WiFi Odds design system, aligned to wifiodds.com (V5, approved 28 Jul 2026).
     The variable NAMES are unchanged so popup.js and every existing rule keep
     working; only the values move. --sky and --united-blue* are retained as
     names because they are referenced throughout, but they now carry the
     product's cyan/violet ramp rather than the old airline-blue palette. */
  :root {
    --bg: #050505;
    --card-bg: #0d0d0f;
    --card-edge: #29292f;
    --ink: #ffffff;
    --dim: #a6a6ad;
    --united-blue: #29d8ff;   /* ramp start · was airline blue */
    --united-blue-2: #926cff;  /* ramp end */
    --sky: #29d8ff;
    --gold: #ffd45a;
    --green: #54f09b;
    --red: #ff698d;
    --unknown: #85858e;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 360px;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .usl-wrap { padding: 14px 16px 12px; }

  .usl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .usl-title {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--sky);
    /* Wordmark carries the site's cyan→violet ramp. The colour above is the
       fallback anywhere background-clip:text is unsupported. */
    background: linear-gradient(105deg, #29d8ff, #7cc9ff 48%, #926cff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .usl-full-link {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--sky);
    text-decoration: none;
    white-space: nowrap;
  }
  .usl-full-link:hover { text-decoration: underline; }
  .usl-credit {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--dim);
    margin-top: 2px;
    margin-bottom: 12px;
  }

  .usl-form {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .usl-input {
    flex: 1;
    min-width: 0;
    background: var(--card-bg);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    text-align: center;
    text-transform: uppercase;
    padding: 8px 4px;
    outline: none;
  }
  .usl-input:focus { border-color: var(--sky); }
  .usl-arrow { color: var(--dim); font-size: 14px; }
  .usl-go {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    /* Near-black on the light cyan→violet gradient (white was 1.70:1 / 3.61:1;
       near-black is 11.92:1 / 5.60:1) — matches the panel's gradient action. */
    color: #05060a;
    background: linear-gradient(135deg, var(--united-blue), var(--united-blue-2));
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .usl-go:hover { filter: brightness(1.1); }
  .usl-go:disabled { opacity: 0.6; cursor: default; }

  .usl-status {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--dim);
    min-height: 14px;
    margin-bottom: 6px;
  }

  .usl-section-label {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 12px 0 6px;
  }

  .usl-flight-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 7px 10px;
    margin-bottom: 6px;
  }
  .usl-flight-left {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
  }
  .usl-star { color: var(--gold); font-size: 12px; }
  .usl-flight-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* v2.2 — odds as a filled pill on the SAME ramp as the injected panel and the
     on-page badges: green (likely) → lime → amber → coral (unlikely), dark text.
     One scale everywhere so high→low reads identically on every surface. */
  .usl-pct {
    font-family: var(--mono);
    font-weight: 800;
    font-size: 13px;
    padding: 4px 11px;
    border-radius: 9px;
    color: #0a0a12;
  }
  .usl-pct-hi { background: #33cf80; }
  .usl-pct-mid { background: #b6d04f; }
  .usl-pct-low { background: #efb84d; }
  .usl-pct-no { background: #ef8168; }
  .usl-obs {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--dim);
  }

  .usl-itin-row {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink);
    padding: 4px 2px;
    border-bottom: 1px solid var(--card-edge);
  }
  .usl-itin-row:last-child { border-bottom: none; }

  .usl-dep-row {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--green);
    padding: 3px 2px;
  }

  .usl-empty {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    padding: 10px 2px;
    line-height: 1.5;
  }
  .usl-empty a { color: var(--sky); }

  .usl-footer {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--card-edge);
    line-height: 1.4;
  }
  .usl-clickable{cursor:pointer;border-radius:8px}
  .usl-clickable:hover{background:rgba(148,178,255,.08)}
  .usl-clickable:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
  .usl-time{color:var(--dim,#93a1c0);font-size:11px;margin-left:6px}
  /* Ghost = a route-history flight not in the current results. Dim only the
     metadata ("not in these results" + obs count); the flight number and the
     odds pill stay at full contrast (≥4.5:1), never faded with the whole row
     (Codex P1-03 — the panel was fixed, the popup had been missed). */
  .usl-ghost{opacity:1;background:#0a0a0c}
  .usl-ghost .usl-obs,.usl-ghost .usl-time{opacity:.55}
  .usl-trip-row{display:flex;align-items:center;justify-content:space-between;background:var(--card-bg);border:1px solid var(--card-edge);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-family:var(--mono);font-size:12px}
  .usl-trip-main{font-weight:700}
  .usl-trip-sub{color:var(--dim);font-size:10.5px;margin-top:2px;line-height:1.35}
  .usl-t-yes{color:var(--green)} .usl-t-no{color:var(--red)} .usl-t-early{color:var(--dim)}
  .usl-t-swap{color:#ffd166}
  .usl-asof{color:var(--dim);font-size:10px;opacity:.7;margin-left:4px}
  .usl-hist{margin-top:4px;border-top:1px solid var(--card-edge);padding-top:4px}
  .usl-hist-row{color:var(--dim);font-size:10px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .usl-trip-left{cursor:pointer;flex:1;min-width:0}
  .usl-trip-x{cursor:pointer;color:var(--dim);font-size:14px;padding:2px 4px;border:none;background:none}
  .usl-trip-x:hover{color:var(--red)}
  .usl-check-now{font-family:var(--mono);font-size:10.5px;color:var(--sky);cursor:pointer;background:none;border:none;padding:0;text-decoration:underline}
  .usl-airline{background:var(--card-bg);border:1px solid var(--card-edge);border-radius:8px;color:var(--ink);font-family:var(--mono);font-weight:700;font-size:13px;padding:8px 4px;outline:none;cursor:pointer}
  .usl-airline:focus{border-color:var(--sky)}
  .usl-enable{width:100%;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--sky);background:var(--card-bg);border:1px solid var(--card-edge);border-radius:8px;padding:7px 8px;cursor:pointer;text-align:center}
  .usl-enable:hover{background:rgba(148,178,255,.09)}

  /* ── ConnectScore by airline (v2.0) — static, collapsed by default ── */
  .usl-cs{margin-top:14px;border-top:1px solid var(--card-edge);padding-top:10px}
  .usl-cs-sum{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;list-style:none;outline:none}
  .usl-cs-sum::-webkit-details-marker{display:none}
  .usl-cs-sum::before{content:"▸ ";color:var(--sky)}
  .usl-cs[open] .usl-cs-sum::before{content:"▾ "}
  .usl-cs-sum:hover{color:var(--ink)}
  .usl-cs-list{margin-top:8px}
  .usl-cs-row{padding:5px 6px;border-radius:8px;cursor:default}
  .usl-cs-row:hover{background:rgba(148,178,255,.07)}
  .usl-cs-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .usl-cs-name{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .usl-cs-meta{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:6px;font-weight:400}
  .usl-cs-chip{font-family:var(--mono);font-weight:700;font-size:13px;min-width:34px;text-align:right}
  .usl-cs-label{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:5px}
  .usl-cs-note{display:none;font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.45;margin-top:3px;padding-right:2px}
  .usl-cs-row:hover .usl-cs-note,.usl-cs-row.usl-open .usl-cs-note{display:block}
  .usl-cs-live{color:var(--sky)}
  .usl-cs-method{font-family:var(--mono);font-size:9.5px;color:var(--dim);line-height:1.45;margin-top:8px;opacity:.85}
</style>
</head>
<body>
  <div class="usl-wrap">
    <header class="usl-header">
      <div class="usl-title">🛰️ WIFI ODDS</div>
      <a id="usl-full-link" class="usl-full-link" href="https://wifiodds.com/" target="_blank" rel="noopener">wifiodds.com ↗</a>
    </header>
    <div id="usl-credit" class="usl-credit">data: unitedstarlinktracker.com</div>

    <form id="usl-form" class="usl-form">
      <select id="usl-airline" class="usl-airline" title="Airline">
        <option value="UA">UA</option>
        <option value="AS">AS</option>
      </select>
      <input id="usl-from" class="usl-input" type="text" maxlength="3" placeholder="FROM" autocomplete="off" />
      <span class="usl-arrow">→</span>
      <input id="usl-to" class="usl-input" type="text" maxlength="3" placeholder="TO" autocomplete="off" />
      <button id="usl-go" class="usl-go" type="submit">Go</button>
    </form>

    <div id="usl-status" class="usl-status"></div>
    <div id="usl-results" class="usl-results"></div>
    <button id="usl-enable-alaska" class="usl-enable" type="button" hidden>Enable on alaskaair.com</button>
    <button id="usl-enable-gflights" class="usl-enable" type="button" hidden>Enable on Google Flights</button>

    <details id="usl-cs" class="usl-cs">
      <summary id="usl-cs-sum" class="usl-cs-sum">✈ WiFi odds by airline (ConnectScore)</summary>
      <div id="usl-cs-list" class="usl-cs-list"></div>
      <div id="usl-cs-method" class="usl-cs-method"></div>
    </details>

    <div class="usl-section-label" style="margin-top:14px;display:flex;justify-content:space-between;align-items:baseline">
      <span>Guardian · booking-to-boarding tail watch</span>
      <button id="usl-check-now" class="usl-check-now" type="button">check now</button>
    </div>
    <div id="usl-trips"></div>
    <form id="usl-watch-form" class="usl-form" style="margin-bottom:0">
      <input id="usl-watch-fn" class="usl-input" type="text" maxlength="6" placeholder="UA1812" title="Flight number — UA or AS, e.g. UA1812 or AS1" autocomplete="off" />
      <input id="usl-watch-date" class="usl-input" type="date" style="font-size:11.5px;flex:1.5;text-transform:none;letter-spacing:0" />
      <button class="usl-go" type="submit">Watch</button>
    </form>
    <div id="usl-watch-status" class="usl-status" style="margin-top:4px"></div>

    <div class="usl-footer">Estimates from tail-assignment history — verify at T-48h.</div>
  </div>
  <script src="airlines.js"></script>
  <script src="popup.js"></script>
</body>
</html>
